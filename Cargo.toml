[package]
name = "windows-mcp-highspeed"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
regex = "1.13.1"
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }
